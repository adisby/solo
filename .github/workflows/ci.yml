name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solo_test
          POSTGRES_USER: solo
          POSTGRES_PASSWORD: solo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solo -d solo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run database migrations
        run: go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://solo:solo-test@localhost:5432/solo_test?sslmode=disable

      - name: Run Go tests
        run: go test ./... -v -count=1
        env:
          DATABASE_URL: postgres://solo:solo-test@localhost:5432/solo_test?sslmode=disable
          TEAM_FORMATION_TEST_DATABASE_URL: postgres://solo:solo-test@localhost:5432/solo_test?sslmode=disable
          JWT_SECRET: ci-test-secret
          APP_ENV: test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Evaluation infrastructure classification
        working-directory: frontend
        run: npx playwright test agent-evals.spec.ts --grep 'preserves infrastructure failure classification' --reporter=line

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build Windows binaries
        run: |
          go build ./cmd/solo
          go build ./cmd/daemon

      - name: Windows unit tests for the CLI and Daemon
        run: go test ./cmd/solo/... ./cmd/daemon/... ./pkg/agent/... -count=1

      - name: PowerShell installer end to end
        shell: pwsh
        run: ./scripts/test-release-install.ps1

      - name: Daemon autostart task lifecycle
        shell: pwsh
        run: |
          # Registers and removes a uniquely named task, so it never touches a
          # real 'Solo Daemon' task on the runner.
          $task = "Solo Daemon CI $env:GITHUB_RUN_ID"
          $bin = Join-Path $env:RUNNER_TEMP 'solo-autostart'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'solo-daemon.exe') -Value 'stub'
          $credDir = Join-Path $env:USERPROFILE '.solo\daemon'
          New-Item -ItemType Directory -Path $credDir -Force | Out-Null
          $cred = Join-Path $credDir 'credentials.json'
          $hadCredential = Test-Path $cred
          if (-not $hadCredential) { Set-Content -LiteralPath $cred -Value '{"computer_id":"ci","credential":"ci"}' }
          try {
            ./scripts/autostart-daemon.ps1 -Check -TaskName $task
            if ($LASTEXITCODE -ne 1) { throw "expected no task before enable, exit=$LASTEXITCODE" }
            ./scripts/autostart-daemon.ps1 -Enable -BinDir $bin -TaskName $task
            ./scripts/autostart-daemon.ps1 -Check -TaskName $task
            if ($LASTEXITCODE -ne 0) { throw "expected the task after enable, exit=$LASTEXITCODE" }
            ./scripts/autostart-daemon.ps1 -Disable -BinDir $bin -TaskName $task
            ./scripts/autostart-daemon.ps1 -Check -TaskName $task
            if ($LASTEXITCODE -ne 1) { throw "expected no task after disable, exit=$LASTEXITCODE" }
          } finally {
            schtasks.exe /delete /f /tn $task 2>$null
            if (-not $hadCredential) { Remove-Item -LiteralPath $cred -Force -ErrorAction SilentlyContinue }
          }

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: solo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval-graders:
    name: Evaluation graders and adoption rules
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pull the pinned grading environment
        run: docker pull python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
      - name: Verify real isolated graders, frozen public cases and adoption gates
        run: python3 -m unittest discover -s evals -p test_evals.py -v
